name: Build formulation lab image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/formulation-lab-image.yml"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rd/formulation-lab/**"
  workflow_dispatch:

concurrency:
  group: formulation-lab-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/flavoneer-formulation-lab

jobs:
  build-and-push:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rd/formulation-lab/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=formulation-lab
          cache-to: type=gha,mode=max,scope=formulation-lab

      - name: Deploy the new image with Coolify
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_LAB_DEPLOY_WEBHOOK }}
        shell: bash
        run: |
          if [[ -z "$COOLIFY_API_TOKEN" || -z "$COOLIFY_DEPLOY_WEBHOOK" ]]; then
            echo "Coolify deployment secrets are not configured; skipping deployment."
            exit 0
          fi

          curl \
            --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --show-error \
            --silent \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_DEPLOY_WEBHOOK"
