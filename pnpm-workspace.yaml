packages:
  - "apps/*"
  - "packages/*"
  - "rd/*"

nodeLinker: hoisted

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@sentry/cli"
  - "esbuild"
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  aws-sdk: false
  core-js: false
  esbuild: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.12'
  - '@expo/router-server@57.0.5'
  - '@expo/ui@57.0.9'
  - expo-constants@57.0.9
  - expo-image@57.0.2
  - expo-linking@57.0.5
  - expo-modules-core@57.0.9
  - expo-router@57.0.10
  - expo@57.0.10
